[build]
  publish = "."
  functions = "netlify/functions"

# Old single-page link to the About overlay now has its own page
[[redirects]]
  from = "/about"
  to = "/about/"
  status = 301

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/site.*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
[[headers]]
  for = "/assets/analytics.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true
